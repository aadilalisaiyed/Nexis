[project]
name = "code-review-env"
version = "1.0.0"
description = "Code review RL environment"
authors = [{name = "Aadil"}]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "openai",
    "pyyaml",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "app.main:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"